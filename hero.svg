<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="hero-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#12131f"/>
    </linearGradient>

    <!-- Aurora Hairline Border Gradient -->
    <linearGradient id="aurora-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.5">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#f472b6;#22d3ee;#a78bfa;#f472b6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Aurora Text Gradient -->
    <linearGradient id="aurora-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#22d3ee;#a78bfa;#f472b6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Dot Pattern Background -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <!-- Edge Melting Gradient Mask for Viewfinder -->
    <mask id="viewfinder-edge-mask">
      <rect x="0" y="0" width="340" height="380" fill="white" rx="12"/>
      <radialGradient id="mask-radial" cx="50%" cy="50%" r="50%">
        <stop offset="70%" stop-color="#ffffff" stop-opacity="1"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
    </mask>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes rec-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.2); opacity: 0.4; }
      }
      @keyframes mask-reveal {
        0% { transform: translateY(100%); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      @keyframes role-cycle {
        0%, 30% { opacity: 1; transform: translateY(0); }
        33%, 63% { opacity: 0; transform: translateY(-10px); }
        66%, 96% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes corner-draw {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scrubber {
        0% { width: 0px; }
        70% { width: 260px; }
        100% { width: 260px; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(380px); }
      }
      @keyframes wave-arm {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(12deg); }
        75% { transform: rotate(-8deg); }
      }
      
      .rec-dot { animation: rec-pulse 1.5s infinite ease-in-out; transform-origin: center; }
      .cursor { animation: blink 1s infinite; }
      .corner-bracket { stroke-dasharray: 100; animation: corner-draw 1.5s ease-out forwards; }
      .scrub-line { animation: scrubber 4s infinite linear; }
      .scan-effect { animation: scanline 3s infinite linear; }
      .waving-hand { animation: wave-arm 2s infinite ease-in-out; transform-origin: 230px 240px; }

      .text-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace; }
      .text-sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Main Card Body -->
  <rect width="900" height="460" rx="16" fill="url(#hero-bg-grad)" />
  <rect width="900" height="460" rx="16" fill="url(#dot-grid)" />
  <!-- Hairline Gradient Border -->
  <rect width="898" height="458" x="1" y="1" rx="15" fill="none" stroke="url(#aurora-border)" stroke-width="1.5" />

  <!-- ================= LEFT COLUMN: INFO & INTRO ================= -->
  <g transform="translate(45, 45)">
    <!-- Open to Collabs Pill -->
    <g transform="translate(0, 0)">
      <rect width="180" height="32" rx="16" fill="#161927" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="20" cy="16" r="5" fill="#22d3ee" class="rec-dot" filter="url(#glow-cyan)"/>
      <text x="36" y="21" class="text-mono" font-size="12" font-weight="600" fill="#22d3ee" letter-spacing="0.5">OPEN TO COLLABS</text>
    </g>

    <!-- Typewriter Greeting -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" class="text-mono" font-size="18" fill="#a78bfa" font-weight="500">
        Hi there, I'm <tspan class="cursor" fill="#22d3ee">█</tspan>
      </text>
    </g>

    <!-- Big Name Title with Gradient Mask Reveal -->
    <g transform="translate(0, 85)">
      <text x="0" y="48" class="text-sans" font-size="44" font-weight="900" fill="url(#aurora-text)" letter-spacing="-1">
        Tazim Kassar
      </text>
    </g>

    <!-- Cycling Role Lines -->
    <g transform="translate(0, 162)">
      <!-- Role Container -->
      <rect width="360" height="30" rx="6" fill="#151726" fill-opacity="0.6" />
      <text x="12" y="20" class="text-mono" font-size="14" font-weight="600" fill="#38bdf8">
        &gt; <tspan fill="#f472b6">Full-Stack Architect</tspan> &amp; <tspan fill="#22d3ee">AI Developer</tspan>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.33;0.96;1" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="12" y="20" class="text-mono" font-size="14" font-weight="600" fill="#38bdf8" opacity="0">
        &gt; <tspan fill="#a78bfa">Web IDE &amp; Platform Engine</tspan> Creator
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.36;0.63;0.66" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="12" y="20" class="text-mono" font-size="14" font-weight="600" fill="#38bdf8" opacity="0">
        &gt; <tspan fill="#22d3ee">SaaS &amp; Cloud Systems</tspan> Specialist
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.96;1" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Pitch Line -->
    <g transform="translate(0, 215)">
      <text x="0" y="0" class="text-sans" font-size="14" fill="#94a3b8" width="420">
        Building intelligent developer tools, AI-powered Web IDEs
      </text>
      <text x="0" y="22" class="text-sans" font-size="14" fill="#94a3b8">
        &amp; high-performance cloud applications.
      </text>
    </g>

    <!-- Meta Info Row (Location, Company, Projects) -->
    <g transform="translate(0, 280)">
      <!-- Location Badge -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#131524" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
        <!-- Map Pin Icon -->
        <path d="M16 10 C13.2 10 11 12.2 11 15 C11 18.8 16 24 16 24 C16 24 21 18.8 21 15 C21 12.2 18.8 10 16 10 Z M16 17 C14.9 17 14 16.1 14 15 C14 13.9 14.9 13 16 13 C17.1 13 18 13.9 18 15 C18 16.1 17.1 17 16 17 Z" fill="#22d3ee" transform="translate(0, -1)"/>
        <text x="30" y="21" class="text-sans" font-size="12" font-weight="500" fill="#cbd5e1">SF / Remote</text>
      </g>

      <!-- Company Badge -->
      <g transform="translate(155, 0)">
        <rect width="135" height="34" rx="8" fill="#131524" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
        <!-- Building/Briefcase Icon -->
        <path d="M12 10 H20 V22 H12 Z M10 13 H22 M14 7 H18 V10 H14 Z" fill="#none" stroke="#a78bfa" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="32" y="21" class="text-sans" font-size="12" font-weight="600" fill="#cbd5e1">IntelliDev</text>
      </g>

      <!-- Repos/Stars Badge -->
      <g transform="translate(300, 0)">
        <rect width="125" height="34" rx="8" fill="#131524" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
        <!-- Star Icon -->
        <path d="M15 9.5 L16.8 13.2 L20.9 13.8 L17.9 16.7 L18.6 20.8 L15 18.9 L11.4 20.8 L12.1 16.7 L9.1 13.8 L13.2 13.2 Z" fill="#f472b6"/>
        <text x="28" y="21" class="text-sans" font-size="12" font-weight="600" fill="#cbd5e1">50+ Repos</text>
      </g>
    </g>

    <!-- Quick Tech Badges Pill Row -->
    <g transform="translate(0, 332)">
      <text x="0" y="16" class="text-mono" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1">STACK HIGHLIGHTS:</text>
      <g transform="translate(130, 2)">
        <rect x="0" y="0" width="55" height="20" rx="4" fill="#1e293b"/><text x="8" y="14" class="text-mono" font-size="10" fill="#38bdf8">React</text>
        <rect x="61" y="0" width="60" height="20" rx="4" fill="#1e293b"/><text x="69" y="14" class="text-mono" font-size="10" fill="#a78bfa">Node.js</text>
        <rect x="127" y="0" width="75" height="20" rx="4" fill="#1e293b"/><text x="135" y="14" class="text-mono" font-size="10" fill="#f472b6">TypeScript</text>
        <rect x="208" y="0" width="55" height="20" rx="4" fill="#1e293b"/><text x="216" y="14" class="text-mono" font-size="10" fill="#4ade80">Python</text>
        <rect x="269" y="0" width="45" height="20" rx="4" fill="#1e293b"/><text x="277" y="14" class="text-mono" font-size="10" fill="#fbbf24">AI/LLM</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: CAMERA VIEWFINDER HERO ================= -->
  <g transform="translate(515, 40)">
    <!-- Viewfinder Container Frame -->
    <rect width="340" height="380" rx="14" fill="#0b0c14" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    
    <!-- Viewfinder Inner Display Backdrop -->
    <rect x="10" y="42" width="320" height="296" rx="8" fill="#07080f"/>

    <!-- Subtle Grid overlay inside Viewfinder -->
    <path d="M10 140 H330 M10 240 H330 M116 42 V338 M223 42 V338" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Animated Vector Developer Avatar (Selfie Waving Clip Simulation) -->
    <g transform="translate(10, 42)">
      <!-- Background Aurora Glow in Viewfinder -->
      <circle cx="160" cy="140" r="110" fill="#22d3ee" fill-opacity="0.12" filter="url(#glow-soft)">
        <animate attributeName="r" values="100;120;100" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="180" r="80" fill="#f472b6" fill-opacity="0.1" filter="url(#glow-soft)">
        <animate attributeName="r" values="70;95;70" dur="5s" repeatCount="indefinite"/>
      </circle>

      <!-- Developer Character Artwork -->
      <!-- Hoodie Body -->
      <path d="M80 296 C80 230 110 200 160 200 C210 200 240 230 240 296 Z" fill="#1e1b4b"/>
      <!-- Inner Shirt -->
      <path d="M135 220 L160 250 L185 220 L160 296 Z" fill="#fbbf24" fill-opacity="0.9"/>
      <!-- Hoodie Zip Accent -->
      <path d="M160 210 V296" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Head / Face -->
      <circle cx="160" cy="145" r="48" fill="#fde047" fill-opacity="0.15"/>
      <ellipse cx="160" cy="145" rx="42" ry="46" fill="#fca5a5" fill-opacity="0.3"/>
      
      <!-- Hair & Sunglasses -->
      <!-- Dark Stylish Hair -->
      <path d="M115 140 C110 100 140 85 160 85 C190 85 210 100 205 140 C195 110 170 100 160 100 C140 100 125 115 115 140 Z" fill="#0f172a"/>
      <!-- Sunglasses on Head -->
      <rect x="130" y="94" width="26" height="14" rx="3" fill="#22d3ee" fill-opacity="0.8"/>
      <rect x="164" y="94" width="26" height="14" rx="3" fill="#22d3ee" fill-opacity="0.8"/>
      <line x1="156" y1="100" x2="164" y2="100" stroke="#0f172a" stroke-width="2"/>

      <!-- Warm Smile -->
      <path d="M148 162 Q160 172 172 162" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Waving Hand & Arm -->
      <g class="waving-hand">
        <path d="M220 220 Q245 180 255 145" fill="none" stroke="#1e1b4b" stroke-width="22" stroke-linecap="round"/>
        <!-- Hand -->
        <circle cx="258" cy="140" r="14" fill="#fca5a5" fill-opacity="0.6"/>
        <!-- Waving Motion Lines -->
        <path d="M272 125 C278 135 278 145 272 155" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
        <path d="M278 120 C286 135 286 150 278 160" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Laptop Held in Front -->
      <rect x="110" y="240" width="100" height="56" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Glowing Screen Logo -->
      <polygon points="160,256 168,272 152,272" fill="#22d3ee" filter="url(#glow-cyan)"/>
    </g>

    <!-- Scanline Laser Effect -->
    <g fill="none" class="scan-effect">
      <line x1="10" y1="0" x2="330" y2="0" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="2"/>
    </g>

    <!-- Viewfinder Corner Brackets -->
    <path d="M20 70 V52 H38" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" class="corner-bracket"/>
    <path d="M320 70 V52 H302" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" class="corner-bracket"/>
    <path d="M20 310 V328 H38" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" class="corner-bracket"/>
    <path d="M320 310 V328 H302" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" class="corner-bracket"/>

    <!-- Top Viewfinder Header HUD -->
    <g transform="translate(20, 16)">
      <!-- REC Dot -->
      <circle cx="10" cy="10" r="5" fill="#ef4444" class="rec-dot"/>
      <text x="22" y="14" class="text-mono" font-size="11" font-weight="700" fill="#ef4444" letter-spacing="1">REC</text>
      
      <text x="120" y="14" class="text-mono" font-size="10" fill="#64748b">CAM_01 // HERO</text>
      <text x="250" y="14" class="text-mono" font-size="10" fill="#22d3ee" font-weight="600">60 FPS</text>
    </g>

    <!-- Bottom Scrubber & Time Sync Bar -->
    <g transform="translate(20, 348)">
      <text x="0" y="12" class="text-mono" font-size="10" fill="#94a3b8">0:01 / 0:02</text>
      <!-- Track -->
      <rect x="80" y="5" width="220" height="4" rx="2" fill="#1e293b"/>
      <!-- Synced Scrubber Fill -->
      <rect x="80" y="5" width="160" height="4" rx="2" fill="url(#aurora-text)" class="scrub-line"/>
    </g>
  </g>
</svg>
